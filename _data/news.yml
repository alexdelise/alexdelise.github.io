- date: 2026-03-27
  text: "I was named a [2026 Goldwater Scholar](https://news.fsu.edu/news/students-campus-life/2026/04/13/fsu-achieves-historic-milestone-four-students-named-2026-goldwater-scholars/), a national award recognizing undergraduate researchers in STEM."

- date: 2026-04-10
  text: "Our manuscript, [*Optimal Linear Baseline Models for Scientific Machine Learning*](https://www.aimsciences.org/article/doi/10.3934/fods.2026012), was accepted for publication in *Foundations of Data Science*."

- date: 2026-05-06
  text: "Our manuscript, [*Active Learning for Conditional Generative Compressed Sensing*](https://arxiv.org/abs/2605.05435), is now available on arXiv."

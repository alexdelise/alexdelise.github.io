<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Presentation Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="leaflet_dist/screen.css">
</head>
<body>
  <div id="map" aria-label="Presentation locations"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="org-locations.js"></script>
  <script>
    var tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });

    var map = L.map("map", {
      center: [37.8, -96],
      zoom: 4,
      layers: [tiles],
      scrollWheelZoom: false
    });

    var markers = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 60
    });

    addressPoints.forEach(function(point) {
      var marker = L.marker([point[1], point[2]], { title: point[0].replace(/<[^>]*>/g, " ") });
      marker.bindPopup(point[0]);
      markers.addLayer(marker);
    });

    map.addLayer(markers);

    if (addressPoints.length > 0) {
      map.fitBounds(markers.getBounds().pad(0.18));
    }
  </script>
</body>
</html>
